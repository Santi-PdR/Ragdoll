name: Forge 1.20.1 build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - run: gradle build --no-daemon
      - name: Verify JAR contents
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar')
          test "${#jars[@]}" -eq 1
          python3 - "${jars[0]}" <<'PY'
          import sys, zipfile
          jar = sys.argv[1]
          with zipfile.ZipFile(jar) as archive:
              names = archive.namelist()
              assert "META-INF/mods.toml" in names, "mods.toml missing"
              assert "ragdoll" in archive.read("META-INF/mods.toml").decode(), "wrong mod id"
              classes = [name for name in names if name.endswith(".class")]
              assert classes, "no compiled classes in JAR"
              print(f"Verified {jar}: {len(classes)} classes and Forge metadata")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ragdoll-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
