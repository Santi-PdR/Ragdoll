name: Forge 1.20.1 build

on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sable-dependency:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NotAsher999/sable-1.20.1
          ref: e4d2ab3724a9f5820e758646447d3a571761db11
          path: sable-source
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - name: Build pinned Sable Forge dependency
        shell: cmd
        working-directory: sable-source
        run: build.cmd release
      - name: Upload pinned Sable Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: sable-forge-1.20.1-2.0.5-port.1
          path: sable-source/dist/sable-forge-1.20.1-2.0.5-port.1.jar
          if-no-files-found: error

  build:
    needs: sable-dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - uses: actions/download-artifact@v4
        with:
          name: sable-forge-1.20.1-2.0.5-port.1
          path: libs
      - run: gradle build --no-daemon
      - name: Verify combined JAR contents
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar')
          test "${#jars[@]}" -eq 1
          python3 - "${jars[0]}" <<'PY'
          import sys, zipfile
          jar = sys.argv[1]
          with zipfile.ZipFile(jar) as archive:
              names = set(archive.namelist())
              mod_text = archive.read("META-INF/mods.toml").decode()
              for mod_id in ("sable_player_ragdoll", "ragdoll_reactions"):
                  assert f'modId="{mod_id}"' in mod_text, f"{mod_id} metadata missing"
              classes = [name for name in names if name.endswith(".class")]
              assert len(classes) >= 150, f"expected original ragdoll systems, found only {len(classes)} classes"
              for resource in (
                  "sable_player_ragdoll.mixins.json",
                  "sable_player_ragdoll.neoforge.mixins.json",
                  "assets/ragdoll_reactions/sounds/punch.ogg",
                  "assets/sable_player_ragdoll/sounds/impact.ogg",
              ):
                  assert resource in names, f"{resource} missing"
              print(f"Verified {jar}: {len(classes)} classes, both mod IDs, mixins, and sounds")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ragdoll-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
