plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'dev.santi.ragdoll'
version = '1.0.0'
base { archivesName = 'ragdoll-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { ragdoll { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.ryanhcode.dev/releases' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // The pinned Forge port supplies the exact Rapier-backed sub-level physics API.
    modImplementation fg.deobf(files('libs/sable-forge-1.20.1-2.0.5-port.1.jar'))
    compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.20.1:1.6.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
