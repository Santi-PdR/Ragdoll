plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'dev.santi.ragdoll'
version = '1.0.0'
base { archivesName = 'ragdoll-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                sable_player_ragdoll { source sourceSets.main }
                ragdoll_reactions { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // Built from the pinned Sable Forge source in CI; contains the companion API.
    implementation fg.deobf(files('libs/sable-forge-1.20.1-2.0.5-port.1.jar'))

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}


tasks.named('jar') {
    manifest { attributes(['MixinConfigs': 'sable_player_ragdoll.mixins.json,sable_player_ragdoll.neoforge.mixins.json']) }
    finalizedBy 'reobfJar'
}
